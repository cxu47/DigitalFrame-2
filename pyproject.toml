[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "digitalframe-2"
version = "0.1.0"
description = "Private family slideshow served from a Hong Kong Alibaba OSS bucket"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alibabacloud-oss-v2==1.4.0",
    "fastapi==0.141.1",
    "pillow==12.3.0",
    "pillow-heif==1.4.0",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    "typer==0.27.2",
    "uvicorn==0.52.4",
]

[project.scripts]
digitalframe = "digitalframe.cli:main"

[tool.setuptools]
packages = ["digitalframe"]

[tool.setuptools.package-data]
digitalframe = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2==2.13.0",
    "pytest==9.1.1",
]
