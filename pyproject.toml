[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "digitalframe-2"
version = "0.1.0"
description = "Private family slideshow served from a Hong Kong Alibaba OSS bucket"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = []

[tool.setuptools]
packages = ["digitalframe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
